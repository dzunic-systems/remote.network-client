name: release

# A pushed tag vX.Y.Z builds every platform and publishes the GitHub
# Release that scripts/install.sh downloads from: versioned binaries
# (remote-client-<version>-<os>-<arch>), the stable names install.sh asks
# releases/latest/download for (remote-client-<os>-<arch>), and
# checksums.txt. The web UI (web/) is built first and embedded; the
# committed dist/.gitkeep means go build alone still works, but a release
# must carry the real UI.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build the web UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - run: go vet ./...
      - run: go test -race ./...
      - run: make release VERSION="$GITHUB_REF_NAME"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A release that already exists (made by hand, or by an earlier
        # run of this tag) gets this run's files instead of failing.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "remote-client $GITHUB_REF_NAME" \
              --notes "Install: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | sh — checksums in checksums.txt."
          fi
